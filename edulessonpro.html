<!DOCTYPE html>

<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        /* Custom Scrollbar for Glass Theme */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.4);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(226, 232, 240, 0.6);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .checkbox-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
        }

        .checkbox-card:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        /* Sidebar Glass */
        .glass-sidebar {
            background: rgba(15, 23, 42, 0.85);
            /* Slate 900 with opacity */
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-slate-50 relative min-h-screen flex flex-col md:flex-row overflow-hidden selection:bg-blue-500/30">

    <!-- Auth Guard -->
    <!-- Auth Guard Removed -->

    <!-- Background Gradient Animation -->

        <div
            class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-400/20 rounded-full blur-[120px] animate-pulse">
        </div>

    <!-- Left Sidebar (Dark Glass) -->

                <span id="userDisplay"

            <div class="grid lg:grid-cols-2 gap-8">

                            <div class="grid grid-cols-2 gap-3">

                <!-- Column 2 -->
                <div class="space-y-6">
                    <div class="glass-panel p-8 rounded-[2.5rem]">
                        <div class="flex items-center gap-3 border-b border-slate-100 pb-4 mb-6">
                            <i class="fas fa-users text-purple-500"></i>
                            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Profil
                                Pancasila (P3)</h4>
                        </div>
                        <div class="grid grid-cols-1 gap-2">
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="p3" value="Beriman, Bertakwa, Berakhlak Mulia"
                                    class="accent-purple-600"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Beriman &
                                    Bertakwa</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="p3" value="Berkebinekaan Global"
                                    class="accent-purple-600"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Kebinekaan
                                    Global</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="p3" value="Bergotong Royong" class="accent-purple-600"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Gotong
                                    Royong</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="p3" value="Mandiri" class="accent-purple-600"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Mandiri</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="p3" value="Bernalar Kritis" class="accent-purple-600"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Bernalar
                                    Kritis</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="p3" value="Kreatif" class="accent-purple-600"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Kreatif</span></label>
                        </div>
                    </div>

                    <div class="glass-panel p-8 rounded-[2.5rem]">
                        <div class="flex items-center gap-3 border-b border-slate-100 pb-4 mb-6">
                            <i class="fas fa-graduation-cap text-orange-400"></i>
                            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Dimensi Profil
                                Lulusan
                            </h4>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="lulusan" value="Keimanan an Ketaqwaan"
                                    class="accent-orange-500"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Keimanan an
                                    Ketaqwaan</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="lulusan" value="Kewargaan" class="accent-orange-500"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Kewargaan</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="lulusan" value="Penalaran Kritis"
                                    class="accent-orange-500"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Penalaran
                                    Kritis</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="lulusan" value="Kreativitas" class="accent-orange-500"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Kreativitas</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="lulusan" value="Kolaborasi" class="accent-orange-500"><span

                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="lulusan" value="Kemandirian" class="accent-orange-500"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Kemandirian</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="lulusan" value="Kesehatan" class="accent-orange-500"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Kesehatan</span></label>
                            <label class="checkbox-card p-3 rounded-xl flex items-center gap-3 cursor-pointer"><input
                                    type="checkbox" name="lulusan" value="Komunikasi" class="accent-orange-500"><span
                                    class="text-[10px] font-bold text-slate-600 uppercase tracking-wide">Komunikasi</span></label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="pt-6">
                <button id="generateBtn" onclick="generateAndCopy()"
                    class="w-full bg-slate-900 text-white py-6 rounded-2xl font-[900] text-xs uppercase tracking-[0.25em] shadow-2xl shadow-slate-900/20 hover:bg-gradient-to-r hover:from-blue-600 hover:to-purple-600 transition-all duration-500 transform hover:-translate-y-1 relative group overflow-hidden">
                    <span class="relative z-10 flex items-center justify-center gap-3"><i
                            class="fas fa-bolt text-yellow-400"></i> Generate Mega Prompt</span>
                    <div
                        class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500">
                    </div>
                </button>

                <div id="aiButtons"
                    class="hidden flex flex-col md:flex-row gap-4 mt-8 animate-in slide-in-from-bottom-4 duration-500">
                    <a href="https://gemini.google.com" target="_blank"
                        class="flex-1 bg-white/80 backdrop-blur-md p-5 rounded-2xl border border-slate-200 flex items-center justify-center gap-3 text-[10px] font-black uppercase text-slate-800 hover:bg-blue-600 hover:text-white transition-all shadow-lg hover:shadow-blue-500/30 group">
                        <i class="fab fa-google text-blue-500 text-xl group-hover:text-white transition-colors"></i>
                        Open Gemini
                    </a>
                    <a href="https://www.chatgpt.com" target="_blank"
                        class="flex-1 bg-white/80 backdrop-blur-md p-5 rounded-2xl border border-slate-200 flex items-center justify-center gap-3 text-[10px] font-black uppercase text-slate-800 hover:bg-[#10a37f] hover:text-white transition-all shadow-lg hover:shadow-green-500/30 group">
                        <i class="fas fa-microchip text-green-500 text-xl group-hover:text-white transition-colors"></i>
                        Open ChatGPT
                    </a>
                </div>
            </div>
        </div>

    <script>
        function generateAndCopy() {
            const data = {
                guru: document.getElementById('guru').value || "[Nama Guru]",
                sekolah: document.getElementById('sekolah').value || "[Institusi]",
                jenjang: document.getElementById('jenjang').value || "[Jenjang]",
                fase: document.getElementById('fase').value || "[Fase]",
                kelas: document.getElementById('kelas').value || "[Kelas]",
                mapel: document.getElementById('mapel').value || "[Mapel]",
                materi: document.getElementById('materi').value || "[Judul]",
                tp: document.getElementById('tp').value || "[Tujuan Pembelajaran]",
                model: document.getElementById('model_ajar').value,
                durasi: document.getElementById('durasi').value || "0",
                pertemuan: document.getElementById('pertemuan').value || "0",
                p3: Array.from(document.querySelectorAll('input[name="p3"]:checked')).map(cb => cb.value).join(", ") || "[P3]",
                lulusan: Array.from(document.querySelectorAll('input[name="lulusan"]:checked')).map(cb => cb.value).join(", ") || "[Lulusan]"
            };

            const prompt = `Berperanlah sebagai **Praktisi Kurikulum Merdeka** dan Pengembang Perangkat Ajar profesional.

Saya membutuhkan **MODUL AJAR (RPP Plus)** yang sangat detail untuk satu pertemuan berdasarkan data berikut:

DATA INPUT:
- Nama Guru: ${data.guru} | Institusi: ${data.sekolah}
- Jenjang/Fase/Kelas: ${data.jenjang} / ${data.fase} / ${data.kelas}
- Mata Pelajaran: ${data.mapel} | Materi Pokok: ${data.materi}
- Tujuan Pembelajaran / Topik: ${data.tp}
- Alokasi Waktu: ${data.durasi} Menit (${data.pertemuan} Pertemuan)
- Model Pembelajaran: ${data.model}
- Profil Pelajar Pancasila: ${data.p3}
- Target Profil Lulusan: ${data.lulusan}

INSTRUKSI KHUSUS:
1.  Sajikan SELURUH output dalam bentuk **TABEL** agar mudah disalin dan dibaca.
2.  Pada bagian **Kegiatan Inti**, hindari kalimat umum seperti "Guru menjelaskan". Gunakan kalimat instruksi konkrit, contoh: "Guru menayangkan video tentang...", "Siswa dalam kelompok mengidentifikasi...", "Guru memberikan pertanyaan pemantik berupa...".
3.  Pastikan sintaks pembelajaran sesuai dengan Model yang dipilih (misal: sintaks ${data.model}).
4.  Integrasikan nilai-nilai Profil Pelajar Pancasila dan Profil Lulusan yang dipilih ke dalam kegiatan pembelajaran.

---

### FORMAT OUTPUT YANG DIMINTA:

**TABEL 1: INFORMASI UMUM**
| Komponen | Deskripsi |
| :--- | :--- |
| Identitas Sekolah | ${data.sekolah}, ${data.guru}, ${data.mapel}, ${data.fase}/${data.kelas} |
| Kompetensi Awal | (Pengetahuan prasyarat siswa) |
| Profil Pelajar Pancasila | ${data.p3} |
| Sarana & Prasarana | (Alat, Media, Sumber Belajar) |
| Target Peserta Didik | (Reguler / Tipikal) |
| Model Pembelajaran | ${data.model} |

**TABEL 2: KOMPONEN INTI**
| Komponen | Deskripsi |
| :--- | :--- |
| Tujuan Pembelajaran | (Jabarkan TP berdasarkan materi: ${data.tp}) |
| Pemahaman Bermakna | (Manfaat materi ini di kehidupan nyata) |
| Pertanyaan Pemantik | (1-2 pertanyaan yang memancing rasa ingin tahu) |
| Asesmen | 1. Diagnostik (Awal)<br>2. Formatif (Proses)<br>3. Sumatif (Lingkup Materi) |

**TABEL 3: LANGKAH PEMBELAJARAN (SKENARIO)**
| Tahapan & Waktu | Kegiatan Guru & Peserta Didik (Konkrit & Detail) |
| :--- | :--- |
| **Pendahuluan** | 1. Guru membuka salam dan doa bersama.<br>2. Guru mengecek kehadiran...<br>3. Apersepsi: ...<br>4. Menyampaikan tujuan pembelajaran... |
| **Kegiatan Inti** | *(Sesuaikan dengan Sintaks ${data.model})*<br>1. **Fase 1:** Guru menampilkan... Siswa mengamati...<br>2. **Fase 2:** Siswa dibagi kelompok...<br>3. **Fase 3:** Siswa mengerjakan LKPD...<br>*(Detailkan langkah sampai evaluasi)* |
| **Penutup** | 1. Siswa menyimpulkan materi...<br>2. Guru memberikan penguatan...<br>3. Refleksi dan Doa penutup. |

---

**PENTING:**
Setelah tabel selesai dibuat, mohon berikan teks penutup berikut secara **tebal (Bold)** dan terpisah dari tabel:

**"Modul Ajar (Skenario) sudah siap. Apakah Anda ingin saya melanjutkan membuat Lampiran LKPD (Lembar Kerja Peserta Didik) dan Rubrik Penilaian untuk pertemuan ini? (Ketik 'Ya' untuk lanjut)"**`;

            // Auto Copy to Clipboard
            navigator.clipboard.writeText(prompt).then(() => {
                const btn = document.getElementById('generateBtn');
                const aiBtns = document.getElementById('aiButtons');

                // Visual Feedback
                btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> PROMPT ULTRA-DETAIL TERSALIN!';
                btn.classList.remove('bg-slate-900', 'hover:bg-gradient-to-r');
                btn.classList.add('bg-green-500');

                aiBtns.classList.remove('hidden'); // Show Gemini/ChatGPT buttons

                // Scroll to buttons
                aiBtns.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                setTimeout(() => {
                    btn.innerHTML = '<span class="relative z-10 flex items-center justify-center gap-3"><i class="fas fa-bolt text-yellow-400"></i> Generate Mega Prompt</span><div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>';
                    btn.classList.add('bg-slate-900');
                    btn.classList.remove('bg-green-500');
                }, 4000);
            });
        }
    </script>
</body>

</html>
