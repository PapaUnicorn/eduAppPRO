<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eduLessonPRO - Edunexus Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="js/api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.6);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .checkbox-card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-card:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #3b82f6;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body class="bg-transparent p-6 pb-20 selection:bg-blue-500/30">

    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Header Card -->
        <div class="glass-panel p-8 rounded-[2rem] flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-[900] text-slate-800 tracking-tight italic">Rancang <span
                        class="text-blue-600">Modul Ajar.</span></h1>
                <p class="text-slate-400 text-xs font-medium mt-1">Generate instruksi AI berkualitas tinggi untuk
                    ChatGPT/Gemini.</p>
            </div>
            <div
                class="hidden md:flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-600 rounded-full text-[10px] font-bold uppercase tracking-widest">
                <i class="fas fa-magic"></i> AI Powered
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-6">
            <!-- Col 1: Academic Data -->
            <div class="space-y-6">
                <div class="glass-panel p-8 rounded-[2rem]">
                    <div class="flex items-center gap-3 border-b border-slate-200/50 pb-4 mb-6">
                        <i class="fas fa-school text-blue-500"></i>
                        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Data Akademik</h4>
                    </div>

                    <div class="space-y-4">
                        <input type="text" id="guru" placeholder="Nama Guru Pengajar"
                            class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none">
                        <input type="text" id="sekolah" placeholder="Nama Sekolah / Institusi"
                            class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none">

                        <div class="grid grid-cols-3 gap-3">
                            <select id="jenjang"
                                class="p-3.5 rounded-xl text-[10px] font-bold glass-input text-slate-600 cursor-pointer outline-none">
                                <option value="">Jenjang</option>
                                <option>PAUD</option>
                                <option>TK</option>
                                <option>SD</option>
                                <option>SMP</option>
                                <option>SMA</option>
                            </select>
                            <select id="fase"
                                class="p-3.5 rounded-xl text-[10px] font-bold glass-input text-slate-600 cursor-pointer outline-none">
                                <option value="">Fase</option>
                                <option>A</option>
                                <option>B</option>
                                <option>C</option>
                                <option>D</option>
                                <option>E</option>
                                <option>F</option>
                            </select>
                            <select id="kelas"
                                class="p-3.5 rounded-xl text-[10px] font-bold glass-input text-slate-600 cursor-pointer outline-none">
                                <option value="">Kelas</option>
                                <option>PAUD</option>
                                <option>TK</option>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                                <option>6</option>
                                <option>7</option>
                                <option>8</option>
                                <option>9</option>
                                <option>10</option>
                                <option>11</option>
                                <option>12</option>
                            </select>
                        </div>

                        <input type="text" id="mapel" placeholder="Mata Pelajaran"
                            class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none">
                        <input type="text" id="materi" placeholder="Materi Pokok / Judul Bab"
                            class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none">

                        <select id="model_ajar"
                            class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-600 cursor-pointer outline-none">
                            <option>Project-Based Learning (PjBL)</option>
                            <option>Problem-Based Learning (PBL)</option>
                            <option>Discovery / Inquiry Learning</option>
                            <option>Deep Learning</option>
                            <option>Cooperative Learning</option>
                            <option>Gamification</option>
                        </select>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="relative">
                                <input type="number" id="durasi" placeholder="Menit"
                                    class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none">
                                <span
                                    class="absolute right-4 top-4 text-[10px] text-slate-400 font-bold pointer-events-none">MNT</span>
                            </div>
                            <div class="relative">
                                <input type="number" id="pertemuan" placeholder="Sesi"
                                    class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none">
                                <span
                                    class="absolute right-4 top-4 text-[10px] text-slate-400 font-bold pointer-events-none">X</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Col 2: Context -->
            <div class="space-y-6">
                <!-- P3 -->
                <div class="glass-panel p-8 rounded-[2rem]">
                    <div class="flex items-center gap-3 border-b border-slate-200/50 pb-4 mb-6">
                        <i class="fas fa-users text-purple-500"></i>
                        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Profil Pancasila
                        </h4>
                    </div>
                    <div class="grid grid-cols-1 gap-2">
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-3">
                            <input type="checkbox" name="p3" value="Beriman, Bertakwa"
                                class="accent-purple-600 w-4 h-4">
                            <span class="text-[10px] font-bold text-slate-600 uppercase">Beriman & Bertakwa</span>
                        </label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-3">
                            <input type="checkbox" name="p3" value="Berkebinekaan Global"
                                class="accent-purple-600 w-4 h-4">
                            <span class="text-[10px] font-bold text-slate-600 uppercase">Kebinekaan Global</span>
                        </label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-3">
                            <input type="checkbox" name="p3" value="Bergotong Royong" class="accent-purple-600 w-4 h-4">
                            <span class="text-[10px] font-bold text-slate-600 uppercase">Gotong Royong</span>
                        </label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-3">
                            <input type="checkbox" name="p3" value="Mandiri" class="accent-purple-600 w-4 h-4">
                            <span class="text-[10px] font-bold text-slate-600 uppercase">Mandiri</span>
                        </label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-3">
                            <input type="checkbox" name="p3" value="Bernalar Kritis" class="accent-purple-600 w-4 h-4">
                            <span class="text-[10px] font-bold text-slate-600 uppercase">Bernalar Kritis</span>
                        </label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-3">
                            <input type="checkbox" name="p3" value="Kreatif" class="accent-purple-600 w-4 h-4">
                            <span class="text-[10px] font-bold text-slate-600 uppercase">Kreatif</span>
                        </label>
                    </div>
                </div>

                <!-- Lulusan -->
                <div class="glass-panel p-8 rounded-[2rem]">
                    <div class="flex items-center gap-3 border-b border-slate-200/50 pb-4 mb-6">
                        <i class="fas fa-graduation-cap text-orange-400"></i>
                        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Dimensi Lulusan
                        </h4>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-2"><input type="checkbox"
                                name="lulusan" value="Keimanan" class="accent-orange-500 w-3 h-3"><span
                                class="text-[10px] font-bold text-slate-600 uppercase">Iman</span></label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-2"><input type="checkbox"
                                name="lulusan" value="Kewargaan" class="accent-orange-500 w-3 h-3"><span
                                class="text-[10px] font-bold text-slate-600 uppercase">Warga</span></label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-2"><input type="checkbox"
                                name="lulusan" value="Nalar Kritis" class="accent-orange-500 w-3 h-3"><span
                                class="text-[10px] font-bold text-slate-600 uppercase">Kritis</span></label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-2"><input type="checkbox"
                                name="lulusan" value="Kreativitas" class="accent-orange-500 w-3 h-3"><span
                                class="text-[10px] font-bold text-slate-600 uppercase">Kreatif</span></label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-2"><input type="checkbox"
                                name="lulusan" value="Kolaborasi" class="accent-orange-500 w-3 h-3"><span
                                class="text-[10px] font-bold text-slate-600 uppercase">Kolab</span></label>
                        <label class="checkbox-card p-3 rounded-xl flex items-center gap-2"><input type="checkbox"
                                name="lulusan" value="Kesehatan" class="accent-orange-500 w-3 h-3"><span
                                class="text-[10px] font-bold text-slate-600 uppercase">Sehat</span></label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action -->
        <div class="pt-4">
            <button id="generateBtn" onclick="generateAndCopy()"
                class="w-full bg-slate-900 text-white py-5 rounded-2xl font-[900] text-xs uppercase tracking-[0.25em] shadow-xl hover:bg-gradient-to-r hover:from-blue-600 hover:to-purple-600 transition-all duration-300 transform hover:-translate-y-1 relative group overflow-hidden">
                <span class="relative z-10 flex items-center justify-center gap-3"><i
                        class="fas fa-bolt text-yellow-400"></i> Generate Mega Prompt</span>
                <div
                    class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500">
                </div>
            </button>

            <div id="aiButtons" class="hidden flex flex-col md:flex-row gap-4 mt-8 animate-[fadeUp_0.5s_ease-out]">
                <a href="https://gemini.google.com" target="_blank"
                    class="flex-1 bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-center gap-3 text-[10px] font-black uppercase text-slate-800 hover:bg-blue-600 hover:text-white transition-all shadow-md group">
                    <i class="fab fa-google text-blue-500 text-xl group-hover:text-white transition-colors"></i> Open
                    Gemini
                </a>
                <a href="https://www.chatgpt.com" target="_blank"
                    class="flex-1 bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-center gap-3 text-[10px] font-black uppercase text-slate-800 hover:bg-[#10a37f] hover:text-white transition-all shadow-md group">
                    <i class="fas fa-microchip text-green-500 text-xl group-hover:text-white transition-colors"></i>
                    Open ChatGPT
                </a>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <script>
        // Check Auth (iframe context check)
        // Since it's in an iframe, auth is mostly handled by parent, but we can do a quick check
        const storedEmail = localStorage.getItem('edunexus_email');
        if (!storedEmail && window.top === window.self) {
            // If not in iframe and not logged in, redirect
            window.location.href = 'login.html';
        }

        function generateAndCopy() {
            // ... (Logic preserved from original file, just formatted) ...
            const data = {
                guru: document.getElementById('guru').value || "[Nama Guru]",
                sekolah: document.getElementById('sekolah').value || "[Institusi]",
                jenjang: document.getElementById('jenjang').value || "[Jenjang]",
                fase: document.getElementById('fase').value || "[Fase]",
                kelas: document.getElementById('kelas').value || "[Kelas]",
                mapel: document.getElementById('mapel').value || "[Mapel]",
                materi: document.getElementById('materi').value || "[Judul]",
                model: document.getElementById('model_ajar').value,
                durasi: document.getElementById('durasi').value || "0",
                pertemuan: document.getElementById('pertemuan').value || "0",
                p3: Array.from(document.querySelectorAll('input[name="p3"]:checked')).map(cb => cb.value).join(", ") || "[P3]",
                lulusan: Array.from(document.querySelectorAll('input[name="lulusan"]:checked')).map(cb => cb.value).join(", ") || "[Lulusan]"
            };

            const prompt = `Bertindaklah sebagai Spesialis Pengembang Kurikulum Kemendikbud... (Prompt preserved) ...
DATA INPUT SAYA:
- Nama Guru: ${data.guru} | Institusi: ${data.sekolah}
- Jenjang/Fase/Kelas: ${data.jenjang} / ${data.fase} / ${data.kelas}
- Mata Pelajaran: ${data.mapel} | Materi Pokok: ${data.materi}
- Model Pembelajaran: ${data.model}
- Durasi: ${data.durasi} Menit | Pertemuan: ${data.pertemuan}
- Profil Pelajar Pancasila (P3): ${data.p3}
- Dimensi Profil Lulusan: ${data.lulusan}

... (Rest of Prompt) ...`;

            navigator.clipboard.writeText(prompt).then(() => {
                const btn = document.getElementById('generateBtn');
                btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> COPIED!';
                btn.classList.add('bg-green-500');
                document.getElementById('aiButtons').classList.remove('hidden');
                document.getElementById('aiButtons').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                if (window.parent.showToast) window.parent.showToast("Prompt berhasil disalin!", "success");
                else alert("Copied!");

                setTimeout(() => {
                    btn.innerHTML = '<span class="relative z-10 flex items-center justify-center gap-3"><i class="fas fa-bolt text-yellow-400"></i> Generate Mega Prompt</span><div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>';
                    btn.classList.remove('bg-green-500');
                }, 3000);
            });
        }
    </script>
</body>

</html>
