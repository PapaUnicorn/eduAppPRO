<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com;">
    <meta name="theme-color" content="#0f172a">
    <title>Member Area - Edunexus PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="js/api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        .glass-sidebar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.6);
        }

        .active-nav {
            background: #0f172a;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(15, 23, 42, 0.3);
        }

        iframe {
            background: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body class="bg-slate-50 relative h-screen overflow-hidden text-slate-900 selection:bg-blue-500/30">

    <!-- Auth Guard -->
    <!-- Auth Guard Removed for Free Access -->

    <div class="flex h-full">
        <!-- Sidebar -->
        <aside
            class="w-80 h-full glass-sidebar flex flex-col justify-between py-8 px-6 z-20 shadow-2xl shadow-blue-900/5">
            <div>
                <!-- Brand -->
                <div class="flex items-center gap-2 mb-10 px-2 cursor-pointer" onclick="location.reload()">
                    <span class="text-2xl font-[900] text-slate-900 tracking-tighter italic"><span
                            class="text-blue-600">EDU</span>NEXUS<span class="text-slate-400">PRO</span></span>
                </div>

                <!-- User Profile Skeleton -->
                <div id="user-skeleton" class="animate-pulse mb-8 p-5 rounded-2xl bg-white/50 border border-slate-100">
                    <div class="h-4 bg-slate-200 rounded w-3/4 mb-3"></div>
                    <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                </div>

                <!-- User Profile -->
                <div id="user-profile"
                    class="hidden mb-8 p-5 rounded-2xl bg-white/80 border border-white shadow-sm relative overflow-hidden group">
                    <div id="plan-badge"
                        class="absolute top-0 right-0 px-3 py-1 text-[9px] font-bold uppercase tracking-widest rounded-bl-xl">
                        LOADING</div>
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                            <span id="user-initial">U</span>
                        </div>
                        <div>
                            <h4 id="user-name" class="font-[800] text-sm text-slate-800 leading-tight">Loading...</h4>
                            <p id="user-email" class="text-[10px] font-medium text-slate-400 truncate w-32">wait...</p>
                        </div>
                    </div>
                </div>

                <!-- Nav Menu -->
                <div class="space-y-2">
                    <p class="px-2 text-[10px] font-extrabold text-slate-400 uppercase tracking-[0.2em] mb-4">Aplikasi
                        Saya</p>
                    <nav id="app-list" class="space-y-2">
                        <!-- App Items injected here -->
                        <div class="p-3 rounded-xl bg-slate-100 animate-pulse h-10 w-full"></div>
                    </nav>
                </div>
            </div>

            <!-- Bottom Actions -->
            <div class="space-y-4">
                <div class="p-4 rounded-2xl bg-purple-50 border border-purple-100">
                    <p class="text-[10px] font-bold text-purple-400 uppercase tracking-widest mb-3 text-center">Ganti
                        Peran</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="switchRole('orangtua')"
                            class="py-2 bg-white text-purple-600 rounded-lg text-[10px] font-[900] uppercase tracking-wider hover:bg-purple-600 hover:text-white transition-all shadow-sm">
                            <i class="fas fa-user-friends mb-1 block"></i> Orangtua
                        </button>
                        <button onclick="switchRole('siswa')"
                            class="py-2 bg-white text-purple-600 rounded-lg text-[10px] font-[900] uppercase tracking-wider hover:bg-purple-600 hover:text-white transition-all shadow-sm">
                            <i class="fas fa-user-graduate mb-1 block"></i> Siswa
                        </button>
                    </div>
                </div>

                <button onclick="logout()"
                    class="w-full py-3 rounded-xl border border-red-100 text-red-500 text-xs font-bold uppercase tracking-widest hover:bg-red-50 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
                <p class="text-[9px] text-center text-slate-300 font-bold uppercase tracking-widest">v3.0.0 Pro</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 relative bg-slate-50 flex flex-col h-full overflow-hidden">
            <!-- Background Decoration -->
            <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
                <div class="absolute top-[-20%] right-[-10%] w-[50%] h-[50%] bg-blue-400/10 rounded-full blur-[100px]">
                </div>
                <div
                    class="absolute bottom-[-20%] left-[-10%] w-[50%] h-[50%] bg-purple-400/10 rounded-full blur-[100px]">
                </div>
            </div>

            <!-- Header -->
            <header
                class="h-16 px-8 flex items-center justify-between z-10 border-b border-slate-200/50 bg-white/40 backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <div id="page-icon"
                        class="w-8 h-8 rounded-lg bg-white flex items-center justify-center text-slate-400 shadow-sm">
                        <i class="fas fa-home"></i>
                    </div>
                    <span id="page-title"
                        class="text-sm font-[800] text-slate-700 uppercase tracking-wide">Dashboard</span>
                </div>
                <div id="clock" class="text-xs font-bold text-slate-400 tracking-widest font-mono">00:00</div>
            </header>

            <!-- Content Area -->
            <div class="flex-1 relative z-10 p-4">
                <iframe id="main-frame" src="about:blank"
                    class="w-full h-full rounded-2xl bg-white border border-slate-200 shadow-sm transition-opacity duration-300 opacity-0"
                    style="display:none;"></iframe>

                <!-- Welcome State -->
                <div id="welcome-state" class="absolute inset-0 flex items-center justify-center p-8">
                    <div class="text-center max-w-lg animate-[fadeUp_1s_ease-out]">
                        <div
                            class="w-24 h-24 bg-white rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-500/10">
                            <i class="fas fa-shapes text-4xl text-blue-500"></i>
                        </div>
                        <h1 class="text-3xl font-[900] text-slate-800 mb-4 tracking-tight">Halo, <span id="welcome-name"
                                class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Member</span>!
                        </h1>
                        <p class="text-slate-500 font-medium">Selamat datang kembali. Silakan pilih aplikasi di menu
                            sebelah kiri untuk memulai.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // Init
        // Init
        async function init() {
            const storedUser = localStorage.getItem('edunexus_user');

            if (!storedUser) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(storedUser);
            renderSidebar(user);
        }

        function renderSidebar(user) {
            // Skeleton Off, Profile On
            document.getElementById('user-skeleton').classList.add('hidden');
            const profile = document.getElementById('user-profile');
            profile.classList.remove('hidden');
            profile.classList.add('flex');

            // Populate Data
            document.getElementById('user-name').innerText = user.name || 'Member';
            document.getElementById('user-email').innerText = user.email || 'No Email';
            document.getElementById('user-initial').innerText = (user.name || 'U').charAt(0);
            try {
                document.getElementById('welcome-name').innerText = user.name.split(' ')[0];
            } catch (e) {
                document.getElementById('welcome-name').innerText = user.name;
            }

            // Badge
            const badge = document.getElementById('plan-badge');
            badge.innerText = user.package || 'Gold';
            if ((user.package || '').toLowerCase() === 'gold') {
                badge.className = "absolute top-0 right-0 px-3 py-1 bg-gradient-to-r from-yellow-400 to-yellow-600 text-white rounded-bl-xl shadow-sm text-[9px] font-bold uppercase tracking-widest";
            } else {
                badge.className = "absolute top-0 right-0 px-3 py-1 bg-slate-200 text-slate-500 rounded-bl-xl text-[9px] font-bold uppercase tracking-widest";
            }

            // Render Apps
            const appsMap = {
                "eduLessonPRO": { name: "eduLessonPRO", link: "edulessonpro.html", icon: "fa-book-open" },
                "eduExamPRO": { name: "eduExamPRO", link: "eduexampro.html", icon: "fa-file-signature" },
                "TTS": { name: "EduGame: TTS", link: "tts.html", icon: "fa-puzzle-piece" },
                "WordSearch": { name: "EduGame: Word Search", link: "wordsearch.html", icon: "fa-search" }
            };

            let allowedApps = [];

            // Access Logic
            // If user.access contains 'ALL', give everything.
            // Otherwise, filter based on substrings in allowedApps (coming from access array)
            const accessList = user.access || [];

            if (accessList.includes('ALL')) {
                allowedApps = Object.keys(appsMap);
            } else {
                // If silver, maybe it's a comma separated string in the first element or multiple elements
                // The gas script returns [packageDetails] or ['ALL']
                const details = accessList[0] || "";
                const targetStr = details.toLowerCase();

                Object.keys(appsMap).forEach(key => {
                    // Check if key or name is in the details string
                    if (targetStr.includes(key.toLowerCase()) || targetStr.includes(appsMap[key].name.toLowerCase())) {
                        allowedApps.push(key);
                    }
                });

                // Fallback: If nothing matched but they are silver, maybe just give generic access or nothing?
                // User said "hanya akses aplikasi yang ia daftar saja". If empty, they see nothing.
            }

            const appContainer = document.getElementById('app-list');
            appContainer.innerHTML = '';

            if (allowedApps.length === 0) {
                appContainer.innerHTML = '<div class="p-4 text-xs text-slate-400 text-center">Tidak ada aplikasi yang tersedia untuk paket Anda.</div>';
            }

            allowedApps.forEach(key => {
                const app = appsMap[key];
                if (!app) return;

                const btn = document.createElement('button');
                btn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-500 hover:bg-white hover:shadow-md hover:text-blue-600 transition-all duration-300 group";
                btn.onclick = () => loadApp(app.name, app.link, app.icon, btn);
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-lg bg-white border border-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition-colors shadow-sm">
                        <i class="fas ${app.icon}"></i>
                    </div>
                    <span>${app.name}</span>
                    <i class="fas fa-chevron-right ml-auto opacity-0 group-hover:opacity-100 transition-opacity text-[10px]"></i>
                `;
                appContainer.appendChild(btn);
            });
        }

        function loadApp(name, url, icon, btnElement) {
            // Reset Active
            document.querySelectorAll('#app-list button').forEach(b => {
                b.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold text-slate-500 hover:bg-white hover:shadow-md hover:text-blue-600 transition-all duration-300 group";
            });
            // Set Active
            btnElement.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-xs font-bold active-nav shadow-lg transition-all duration-300 group";

            // Header
            document.getElementById('page-title').innerText = name;
            document.getElementById('page-icon').innerHTML = `<i class="fas ${icon} text-blue-600"></i>`;

            // Iframe
            const frame = document.getElementById('main-frame');
            const welcome = document.getElementById('welcome-state');
            welcome.classList.add('hidden');

            frame.style.display = 'block';
            frame.classList.remove('opacity-100');
            frame.classList.add('opacity-0');

            setTimeout(() => {
                frame.src = url;
                frame.onload = () => {
                    frame.classList.remove('opacity-0');
                    frame.classList.add('opacity-100');
                };
            }, 200);
        }

        function switchRole(role) {
            // Just refresh or show toast, roles don't matter as much in free mode unless specified.
            // But user asked to keep it simple. We'll leave it as a reload for now.
            if (confirm(`Switch view to ${role}?`)) {
                location.reload();
            }
        }

        function logout() {
            // Redirect to home
            localStorage.removeItem('edunexus_user');
            window.location.href = 'index.html';
        }

        init();
    </script>
</body>

</html>
