<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Edunexus PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="js/api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
        }

        .modal {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        body.modal-active .modal {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-900 overflow-x-hidden selection:bg-blue-500/30 p-6 md:p-12 pb-20">

    <!-- Back Button -->
    <a href="index.html"
        class="inline-flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-blue-600 transition-colors mb-8">
        <i class="fas fa-arrow-left"></i> Kembali ke Beranda
    </a>

    <div class="max-w-4xl mx-auto flex flex-col lg:flex-row gap-8">
        <!-- Form -->
        <div class="flex-1 space-y-6">
            <div class="glass-panel p-10 rounded-[2.5rem]">
                <div class="flex items-center gap-4 mb-8">
                    <span
                        class="w-8 h-8 bg-blue-600 text-white rounded-xl flex items-center justify-center text-[10px] font-[900] shadow-lg shadow-blue-500/30">1</span>
                    <h2 class="font-[900] text-sm uppercase tracking-widest text-slate-500">Data Penerima</h2>
                </div>
                <div class="space-y-4">
                    <input type="text" id="userName" oninput="validate()" placeholder="Nama Lengkap"
                        class="w-full p-4 rounded-2xl text-sm font-bold bg-white/50 border border-slate-200 outline-none focus:border-blue-500 transition-colors">
                    <input type="tel" id="userWA" oninput="validate()" placeholder="WhatsApp (08...)"
                        class="w-full p-4 rounded-2xl text-sm font-bold bg-white/50 border border-slate-200 outline-none focus:border-blue-500 transition-colors">
                    <input type="email" id="userEmail" oninput="validate()" placeholder="Email Aktif"
                        class="w-full p-4 rounded-2xl text-sm font-bold bg-white/50 border border-slate-200 outline-none focus:border-blue-500 transition-colors">
                </div>
            </div>

            <div id="appSel" class="glass-panel p-10 rounded-[2.5rem] hidden">
                <div class="flex items-center gap-4 mb-8">
                    <span
                        class="w-8 h-8 bg-slate-900 text-white rounded-xl flex items-center justify-center text-[10px] font-[900]">2</span>
                    <h2 class="font-[900] text-sm uppercase tracking-widest text-slate-500">Pilih Aplikasi</h2>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <label class="cursor-pointer group">
                        <input type="radio" name="opt" value="eduLessonPRO" class="hidden peer" onchange="validate()">
                        <div
                            class="p-6 border border-slate-200 rounded-2xl peer-checked:border-blue-500 peer-checked:bg-blue-50 text-center hover:bg-white transition-all">
                            <i
                                class="fas fa-book-open text-2xl text-slate-300 peer-checked:text-blue-500 mb-2 block"></i>
                            <span class="font-bold text-xs text-slate-700">eduLessonPRO</span>
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="opt" value="eduExamPRO" class="hidden peer" onchange="validate()">
                        <div
                            class="p-6 border border-slate-200 rounded-2xl peer-checked:border-purple-500 peer-checked:bg-purple-50 text-center hover:bg-white transition-all">
                            <i
                                class="fas fa-file-signature text-2xl text-slate-300 peer-checked:text-purple-500 mb-2 block"></i>
                            <span class="font-bold text-xs text-slate-700">eduExamPRO</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Summary -->
        <div class="lg:w-80">
            <div class="glass-panel p-8 rounded-[2.5rem] sticky top-10 flex flex-col items-center text-center">
                <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mb-6 text-slate-400">
                    <i class="fas fa-shopping-bag text-2xl"></i>
                </div>
                <h3 id="pName" class="font-bold text-slate-400 uppercase text-[9px] tracking-[0.3em] mb-2">Checkout</h3>
                <p id="pPrice" class="text-3xl font-[900] text-slate-800 mb-8 tracking-tighter">---</p>
                <button id="btnPay" onclick="toggleModal()"
                    class="w-full bg-slate-900 text-white py-4 rounded-2xl font-[900] uppercase text-[10px] tracking-widest hidden hover:bg-blue-600 transition-all shadow-lg">Bayar
                    Sekarang</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="qModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="toggleModal()"></div>
        <div class="bg-white p-8 rounded-[2.5rem] z-10 w-full max-w-sm relative text-center shadow-2xl">
            <div id="s1">
                <img src="qris.jpg" class="w-48 mx-auto rounded-xl mb-6 shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-500 mb-4">Scan QRIS untuk membayar.</p>
                <button onclick="toStep2()"
                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-[900] text-[10px] uppercase tracking-widest">Sudah
                    Bayar</button>
            </div>

            <div id="s2" class="hidden">
                <h3 class="font-[900] text-lg mb-4">Upload Bukti</h3>
                <input type="file" id="fIn"
                    class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-6">
                <button onclick="upload()"
                    class="w-full bg-slate-900 text-white py-3 rounded-xl font-[900] text-[10px] uppercase tracking-widest">Kirim
                    Konfirmasi</button>
            </div>
        </div>
    </div>

    <script>
        const p = new URLSearchParams(window.location.search).get('plan') || 'gold';

        window.onload = () => {
            document.getElementById('pName').innerText = p === 'gold' ? 'Paket Gold' : 'Paket Silver';
            document.getElementById('pPrice').innerText = p === 'gold' ? 'Rp 99.000' : 'Rp 49.000';
            if (p === 'silver') document.getElementById('appSel').classList.remove('hidden');
        };

        function validate() {
            const ok = document.getElementById('userName').value && document.getElementById('userWA').value && document.getElementById('userEmail').value && (p === 'gold' || document.querySelector('input[name="opt"]:checked'));
            document.getElementById('btnPay').style.display = ok ? 'block' : 'none';
        }
        function toggleModal() { document.body.classList.toggle('modal-active'); }
        function toStep2() { document.getElementById('s1').classList.add('hidden'); document.getElementById('s2').classList.remove('hidden'); }

        async function upload() {
            const file = document.getElementById('fIn').files[0];
            if (!file) return alert("Pilih file bukti transfer!");

            // Converting file to base64 for GAS
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                const payload = {
                    data: base64,
                    filename: file.name,
                    mimeType: file.type,
                    name: document.getElementById('userName').value,
                    email: document.getElementById('userEmail').value,
                    wa: document.getElementById('userWA').value.replace(/\D/g, ''),
                    plan: p,
                    app: p === 'gold' ? 'GOLD_ALL' : document.querySelector('input[name="opt"]:checked').value
                };

                try {
                    await fetch("https://script.google.com/macros/s/AKfycbwZ4yAU4aXx3vSMLUzJTYCJ1ufHBlqu3ZnHhj6heCYcJsBMA5aHGCIXIgZKdlFcGLmCmw/exec", {
                        method: 'POST', mode: 'no-cors',
                        body: JSON.stringify(payload)
                    });
                    alert("Bukti terkirim! Admin akan memverifikasi dalam 24 jam.");
                    window.location.href = 'index.html';
                } catch (e) {
                    alert("Gagal kirim. Coba lagi.");
                }
            };
        }
    </script>
</body>

</html>
