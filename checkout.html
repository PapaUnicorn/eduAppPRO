<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Edunexus PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
        .soft-shadow { box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05); }
        .modal { transition: opacity 0.3s ease; } body.modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-[#fcfcfd] p-6 md:p-12">
    <div class="max-w-4xl mx-auto flex flex-col lg:flex-row gap-8">
        <div class="flex-1 space-y-6">
            <div class="bg-white p-10 rounded-[2.5rem] border border-slate-100 soft-shadow">
                <h2 class="font-extrabold text-sm uppercase tracking-widest mb-8 flex items-center text-slate-400"><span class="w-6 h-6 bg-blue-600 text-white rounded-full flex items-center justify-center text-[10px] mr-3 font-bold">1</span> Data Penerima</h2>
                <div class="grid gap-4">
                    <input type="text" id="userName" oninput="validate()" placeholder="Nama Lengkap" class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm font-medium">
                    <input type="tel" id="userWA" oninput="validate()" placeholder="WhatsApp (08...)" class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm font-medium">
                    <input type="email" id="userEmail" oninput="validate()" placeholder="Email" class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm font-medium">
                </div>
            </div>

            <div id="appSel" class="bg-white p-10 rounded-[2.5rem] border border-slate-100 soft-shadow hidden">
                <h2 class="font-extrabold text-sm uppercase tracking-widest mb-8 flex items-center text-slate-400"><span class="w-6 h-6 bg-blue-600 text-white rounded-full flex items-center justify-center text-[10px] mr-3 font-bold">2</span> Pilih Aplikasi</h2>
                <div class="grid grid-cols-2 gap-4">
                    <label class="cursor-pointer group"><input type="radio" name="opt" value="eduLessonPRO" class="hidden peer" onchange="validate()"><div class="p-4 border-2 border-slate-50 rounded-2xl peer-checked:border-blue-600 peer-checked:bg-blue-50/50 text-center font-bold text-xs transition-all duration-300">eduLessonPRO</div></label>
                    <label class="cursor-pointer group"><input type="radio" name="opt" value="eduExamPRO" class="hidden peer" onchange="validate()"><div class="p-4 border-2 border-slate-50 rounded-2xl peer-checked:border-blue-600 peer-checked:bg-blue-50/50 text-center font-bold text-xs transition-all duration-300">eduExamPRO</div></label>
                </div>
            </div>
        </div>

        <div class="lg:w-80">
            <div class="bg-white p-10 rounded-[2.5rem] border border-slate-100 soft-shadow sticky top-10">
                <h3 id="pName" class="font-bold text-slate-400 uppercase text-[9px] tracking-[0.3em] mb-2">Memuat...</h3>
                <p id="pPrice" class="text-blue-600 font-[800] text-3xl mb-8 tracking-tighter">---</p>
                <button id="btnPay" onclick="toggleModal()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest shadow-lg shadow-slate-100 hidden hover:bg-blue-600 transition-all duration-500">Bayar Sekarang</button>
            </div>
        </div>
    </div>

    <div id="qModal" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onclick="toggleModal()"></div>
        <div class="bg-white p-10 rounded-[3rem] z-50 w-full max-w-[400px] text-center soft-shadow border border-slate-100">
            <div id="s1">
                <h3 class="font-extrabold text-lg mb-6 tracking-tight">Scan QRIS</h3>
                <div class="bg-white p-3 border border-slate-100 rounded-[2rem] inline-block mb-6"><img src="qris.jpg" class="w-56 mx-auto rounded-2xl"></div>
                <div class="mb-8 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <img src="logoqris.png" class="h-4 mx-auto mb-2 opacity-70">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">OVO • DANA • GOPAY • SHOPEEPAY</p>
                </div>
                <button onclick="document.getElementById('s1').classList.add('hidden'); document.getElementById('s2').classList.remove('hidden')" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-[10px] uppercase tracking-widest">SAYA SUDAH BAYAR</button>
            </div>
            <div id="s2" class="hidden">
                <h3 class="font-extrabold text-lg mb-6 tracking-tight">Upload Bukti</h3>
                <div class="border-2 border-dashed border-slate-100 rounded-[2rem] p-10 bg-slate-50 mb-6 cursor-pointer relative hover:border-blue-300 transition-all">
                    <input type="file" id="fIn" class="absolute inset-0 opacity-0 cursor-pointer" onchange="updateF()">
                    <i class="fas fa-image text-2xl text-slate-300 mb-2"></i>
                    <p id="fL" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest italic">Pilih screenshot bukti</p>
                </div>
                <button id="bUp" onclick="upload()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-[10px] uppercase tracking-widest disabled:opacity-30" disabled>KIRIM BUKTI</button>
                <p id="st" class="mt-4 text-blue-600 font-bold animate-pulse text-[10px] uppercase">Mengirim data...</p>
            </div>
            <div id="s3" class="hidden py-8">
                <i class="fas fa-check-circle text-4xl text-green-500 mb-6"></i>
                <h3 class="text-xl font-extrabold mb-2 tracking-tight italic leading-none">Berhasil Terkirim!</h3>
                <p class="text-slate-400 text-[11px] font-medium leading-relaxed">Aktivasi diproses dalam 1x24 jam.</p>
                <button onclick="location.href='index.html'" class="mt-8 text-blue-600 font-bold text-[10px] uppercase tracking-widest">Beranda</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZ4yAU4aXx3vSMLUzJTYCJ1ufHBlqu3ZnHhj6heCYcJsBMA5aHGCIXIgZKdlFcGLmCmw/exec";
        let p = new URLSearchParams(window.location.search).get('plan') || 'gold';
        window.onload = () => {
            document.getElementById('pName').innerText = p === 'gold' ? 'Paket Gold (1 Tahun)' : 'Paket Silver (1 Bulan)';
            document.getElementById('pPrice').innerText = p === 'gold' ? 'Rp 150.000' : 'Rp 49.000';
            if(p === 'silver') document.getElementById('appSel').classList.remove('hidden');
            validate();
        };
        function fixWA(wa) {
            let c = wa.replace(/\D/g, ''); if(c.startsWith('62')) return '0' + c.slice(2); if(c.startsWith('8')) return '0' + c; return c;
        }
        function validate() {
            const ok = document.getElementById('userName').value && document.getElementById('userWA').value && document.getElementById('userEmail').value && (p === 'gold' || document.querySelector('input[name="opt"]:checked'));
            document.getElementById('btnPay').style.display = ok ? 'block' : 'none';
        }
        function toggleModal() { document.getElementById('qModal').classList.toggle('opacity-0'); document.getElementById('qModal').classList.toggle('pointer-events-none'); document.body.classList.toggle('modal-active'); }
        function updateF() { const f = document.getElementById('fIn').files[0]; if(f) { document.getElementById('fL').innerText = f.name; document.getElementById('bUp').disabled = false; } }
        async function upload() {
            const btn = document.getElementById('bUp'); const status = document.getElementById('st'); const file = document.getElementById('fIn').files[0]; if(!file) return;
            btn.classList.add('hidden'); status.classList.remove('hidden');
            const reader = new FileReader(); reader.onload = async () => {
                const name = document.getElementById('userName').value; const email = document.getElementById('userEmail').value;
                const wa = fixWA(document.getElementById('userWA').value); const app = p === 'gold' ? 'GOLD_ALL' : document.querySelector('input[name="opt"]:checked').value;
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ data: reader.result.split(',')[1], filename: `${name}_${wa}_${new Date().getTime()}.${file.name.split('.').pop()}`, mimeType: file.type, name: name, email: email, wa: wa, plan: p, app: app }) });
                document.getElementById('s2').classList.add('hidden'); document.getElementById('s3').classList.remove('hidden');
            }; reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
