<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Area - Edunexus PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
        .soft-shadow { box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="bg-[#fcfcfd] flex items-center justify-center min-h-screen p-6">
    <div id="lBox" class="bg-white p-12 rounded-[2.5rem] soft-shadow border border-slate-100 w-full max-w-[420px] text-center">
        <h2 class="text-xl font-[800] text-slate-900 mb-2 uppercase tracking-tight">Member Access</h2>
        <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mb-10">Sign in to your account</p>
        <div class="space-y-4">
            <input type="email" id="em" placeholder="Email Terdaftar" class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm font-medium">
            <input type="tel" id="wa" placeholder="WhatsApp (08...)" class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm font-medium">
            <button onclick="login()" id="btnL" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-slate-100 hover:bg-blue-600 transition-all duration-500 mt-4">MASUK SEKARANG</button>
        </div>
    </div>

    <div id="dash" class="hidden w-full max-w-4xl">
        <div class="bg-white p-12 rounded-[3rem] soft-shadow border border-slate-100">
            <div class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
                <div class="text-center md:text-left">
                    <h2 class="text-2xl font-[800] text-slate-900 tracking-tight italic leading-none">Selamat Datang kembali!</h2>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-[0.2em] mt-3">Akses aplikasi anda di sini</p>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-red-500 w-10 h-10 rounded-xl hover:bg-red-50 transition-all duration-300"><i class="fas fa-power-off"></i></button>
            </div>
            <div id="pnd" class="hidden p-10 bg-slate-50 text-slate-500 rounded-[2rem] border border-dashed border-slate-200 text-center">
                <i class="fas fa-clock text-2xl mb-4 animate-pulse"></i>
                <h4 class="font-bold text-sm uppercase tracking-widest mb-1">Status: Menunggu Verifikasi</h4>
                <p class="text-[11px] font-medium opacity-70">Aktivasi diproses dalam 1x24 jam.</p>
            </div>
            <div id="act" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZ4yAU4aXx3vSMLUzJTYCJ1ufHBlqu3ZnHhj6heCYcJsBMA5aHGCIXIgZKdlFcGLmCmw/exec";
        function fixWA(wa) {
            let c = wa.replace(/\D/g, '');
            if(c.startsWith('62')) return '0' + c.slice(2);
            if(c.startsWith('8')) return '0' + c;
            return c;
        }

        async function login() {
            const email = document.getElementById('em').value;
            const waRaw = document.getElementById('wa').value;
            const cleanWA = fixWA(waRaw);
            const btn = document.getElementById('btnL');
            if(!email || !cleanWA) return;
            btn.innerText = "MENGECEK..."; btn.disabled = true;

            try {
                const res = await (await fetch(`${SCRIPT_URL}?email=${email}&wa=${cleanWA}`)).json();
                if(res.status === 'found') {
                    localStorage.setItem('edunexus_email', email); localStorage.setItem('edunexus_wa', cleanWA);
                    document.getElementById('lBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden');
                    if(res.userStatus === 'Pending') { document.getElementById('pnd').classList.remove('hidden'); }
                    else {
                        document.getElementById('act').classList.remove('hidden');
                        const appsMap = { 
                            "eduLessonPRO": { name: "eduLessonPRO", link: "edulessonpro.html", icon: "fa-book-open", desc: "Modul Ajar AI" },
                            "eduExamPRO": { name: "eduExamPRO", link: "eduexampro.html", icon: "fa-file-signature", desc: "Asesmen Engine" }
                        };
                        const list = res.plan === 'gold' ? ['eduLessonPRO', 'eduExamPRO'] : [res.app];
                        list.forEach(a => {
                            const app = appsMap[a];
                            document.getElementById('act').innerHTML += `
                                <a href="${app.link}" class="group p-8 border border-slate-100 rounded-[2.5rem] bg-slate-50/50 hover:bg-white hover:soft-shadow transition-all duration-500 text-center">
                                    <i class="fas ${app.icon} text-2xl mb-4 text-blue-600 group-hover:scale-110 transition-all"></i>
                                    <p class="font-extrabold text-slate-800 text-sm tracking-tight">${app.name}</p>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">${app.desc}</p>
                                </a>`;
                        });
                    }
                } else { alert("Data tidak ditemukan."); btn.innerText = "MASUK SEKARANG"; btn.disabled = false; }
            } catch (e) { alert("Error sistem."); btn.innerText = "MASUK SEKARANG"; btn.disabled = false; }
        }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
