<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com;">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <title>Member Area - Edunexus PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="js/api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(226, 232, 240, 0.6);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-slate-50 relative min-h-screen text-slate-900 overflow-x-hidden selection:bg-blue-500/30">

    <!-- Background Gradient Animation -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div
            class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-400/20 rounded-full blur-[120px] animate-pulse">
        </div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-400/20 rounded-full blur-[120px] animate-pulse"
            style="animation-delay: 2s;"></div>
    </div>

    <!-- Auth Guard with Session Expiry -->
    <script>
        // Clear any old session data just in case, or just ignore it.
        // We can set a dummy flag if other pages still rely on "something" being there, 
        // but the goal is to remove checks. For now, we'll just set a simple flag.
        localStorage.setItem('edunexus_free_access', 'true');
    </script>

    <div class="relative z-10 flex items-center justify-center min-h-screen p-6">

        <!-- Login Box -->
        <div id="lBox"
            class="glass-panel p-10 md:p-12 rounded-[2.5rem] w-full max-w-[420px] text-center transform transition-all duration-700 hover:scale-[1.01]">
            <div class="mb-8 flex justify-center">
                <div
                    class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 text-white text-2xl">
                    <i class="fas fa-door-open"></i>
                </div>
            </div>
            <h2 class="text-2xl font-[900] text-slate-900 mb-2 tracking-tight">Selamat Datang</h2>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.25em] mb-10">Member Area Access</p>

            <form id="loginForm" class="space-y-4 text-left" onsubmit="handleLogin(event)">
                <div>
                    <label
                        class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2 ml-1">Username</label>
                    <input type="text" id="username" required
                        class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-slate-700 placeholder:text-slate-400 focus:outline-none"
                        placeholder="Masukan Username">
                </div>

                <div>
                    <label
                        class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2 ml-1">Password
                        (No. WA)</label>
                    <input type="password" id="password" required
                        class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-slate-700 placeholder:text-slate-400 focus:outline-none"
                        placeholder="Nomor WhatsApp">
                </div>

                <button type="submit" id="btnLogin"
                    class="block w-full bg-slate-900 text-white py-4 rounded-xl font-[900] text-xs uppercase tracking-[0.15em] shadow-xl shadow-slate-900/20 hover:bg-gradient-to-r hover:from-blue-600 hover:to-purple-600 hover:shadow-blue-500/30 hover:-translate-y-1 transition-all duration-500 mt-6 relative overflow-hidden group">
                    <span id="btnText" class="relative z-10">MASUK</span>
                    <div
                        class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500">
                    </div>
                </button>
            </form>

            <p class="mt-8 text-[10px] text-slate-400 font-medium">Belum punya akun?
                <a href="register.html" class="text-blue-600 font-bold hover:underline">Daftar Sekarang</a>
            </p>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const btnText = document.getElementById('btnText');
            const originalText = btnText.innerText;

            btn.disabled = true;
            btnText.innerText = "MEMERIKSA...";
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                const payload = {
                    action: 'login',
                    username: username,
                    password: password
                };

                const res = await fetch(API_CONFIG.BASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (result.status === 'success') {
                    // Check if Active? User didn't specify strict active check logic but usually yes.
                    // User prompt: "Jika sukses, maka halaman akan redirect"
                    // We'll store data and redirect.
                    localStorage.setItem('edunexus_user', JSON.stringify(result.data));
                    window.location.href = 'memberarea.html';
                } else {
                    alert('Gagal: ' + result.message);
                }

            } catch (err) {
                console.error(err);
                alert('Gagal terhubung ke server.');
            } finally {
                btn.disabled = false;
                btnText.innerText = originalText;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
    </div>
</body>

</html>
