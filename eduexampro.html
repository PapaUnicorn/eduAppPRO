<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eduExamPRO - Edunexus Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="js/api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.6);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body class="bg-transparent p-6 pb-20 selection:bg-purple-500/30">

    <div class="max-w-5xl mx-auto space-y-6">

        <!-- Header -->
        <div class="glass-panel p-8 rounded-[2rem] flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-[900] text-slate-800 tracking-tight italic">Smart <span
                        class="text-purple-600">Assessment.</span></h1>
                <p class="text-slate-400 text-xs font-medium mt-1">AI-Powered Exam Management System.</p>
            </div>
            <div
                class="hidden md:flex items-center gap-2 px-4 py-2 bg-purple-50 text-purple-600 rounded-full text-[10px] font-bold uppercase tracking-widest">
                <i class="fas fa-brain"></i> Exam Builder
            </div>
        </div>

        <!-- Step 1: Identity -->
        <div class="glass-panel p-8 rounded-[2rem]">
            <div class="flex items-center gap-3 mb-6">
                <span
                    class="w-6 h-6 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center font-[900] text-[10px]">1</span>
                <h3 class="text-xs font-[900] text-slate-600 uppercase tracking-widest">Identitas & Materi</h3>
            </div>
            <div class="grid md:grid-cols-2 gap-4 mb-4">
                <input type="text" id="mapel" placeholder="Mata Pelajaran"
                    class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none">
                <select id="jenjang"
                    class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-600 outline-none cursor-pointer">
                    <option value="">-- Pilih Jenjang --</option>
                    <option value="SD">SD</option>
                    <option value="SMP">SMP</option>
                    <option value="SMA">SMA</option>
                </select>
            </div>
            <div class="grid md:grid-cols-2 gap-4 mb-4">
                <select id="kurikulum"
                    class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-600 outline-none cursor-pointer">
                    <option value="Kurikulum Merdeka">Kurikulum Merdeka</option>
                    <option value="K13">Kurikulum 2013</option>
                </select>
                <input type="text" id="topik" placeholder="Topik / Materi Spesifik"
                    class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none">
            </div>
            <textarea id="indikator" rows="2" placeholder="Indikator / Tujuan Pembelajaran (Opsional)"
                class="w-full p-3.5 rounded-xl text-xs font-bold glass-input text-slate-700 outline-none"></textarea>
        </div>

        <!-- Step 2: Kognitif -->
        <div class="glass-panel p-8 rounded-[2rem]">
            <div class="flex items-center gap-3 mb-6">
                <span
                    class="w-6 h-6 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center font-[900] text-[10px]">2</span>
                <h3 class="text-xs font-[900] text-slate-600 uppercase tracking-widest">Level & Kesulitan</h3>
            </div>
            <div class="grid grid-cols-3 md:grid-cols-6 gap-2 mb-6">
                <label
                    class="p-2 bg-white/50 border border-slate-200 rounded-lg flex items-center justify-center gap-2 cursor-pointer hover:bg-white transition-colors">
                    <input type="checkbox" name="bloom" value="C1"><span
                        class="text-[10px] font-bold text-slate-500">C1</span>
                </label>
                <label
                    class="p-2 bg-white/50 border border-slate-200 rounded-lg flex items-center justify-center gap-2 cursor-pointer hover:bg-white transition-colors">
                    <input type="checkbox" name="bloom" value="C2"><span
                        class="text-[10px] font-bold text-slate-500">C2</span>
                </label>
                <label
                    class="p-2 bg-white/50 border border-slate-200 rounded-lg flex items-center justify-center gap-2 cursor-pointer hover:bg-white transition-colors">
                    <input type="checkbox" name="bloom" value="C3"><span
                        class="text-[10px] font-bold text-slate-500">C3</span>
                </label>
                <label
                    class="p-2 bg-white/50 border border-slate-200 rounded-lg flex items-center justify-center gap-2 cursor-pointer hover:bg-white transition-colors">
                    <input type="checkbox" name="bloom" value="C4"><span
                        class="text-[10px] font-bold text-slate-500">C4</span>
                </label>
                <label
                    class="p-2 bg-white/50 border border-slate-200 rounded-lg flex items-center justify-center gap-2 cursor-pointer hover:bg-white transition-colors">
                    <input type="checkbox" name="bloom" value="C5"><span
                        class="text-[10px] font-bold text-slate-500">C5</span>
                </label>
                <label
                    class="p-2 bg-white/50 border border-slate-200 rounded-lg flex items-center justify-center gap-2 cursor-pointer hover:bg-white transition-colors">
                    <input type="checkbox" name="bloom" value="C6"><span
                        class="text-[10px] font-bold text-slate-500">C6</span>
                </label>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <div class="text-center">
                    <label class="text-[9px] font-bold text-green-500 uppercase block mb-2">Mudah</label>
                    <input type="number" id="qty_mudah"
                        class="w-full p-2 rounded-lg text-center font-bold border border-slate-200 bg-white/50 outline-none focus:bg-white"
                        value="0">
                </div>
                <div class="text-center">
                    <label class="text-[9px] font-bold text-yellow-500 uppercase block mb-2">Sedang</label>
                    <input type="number" id="qty_sedang"
                        class="w-full p-2 rounded-lg text-center font-bold border border-slate-200 bg-white/50 outline-none focus:bg-white"
                        value="0">
                </div>
                <div class="text-center">
                    <label class="text-[9px] font-bold text-red-500 uppercase block mb-2">Sukar</label>
                    <input type="number" id="qty_sukar"
                        class="w-full p-2 rounded-lg text-center font-bold border border-slate-200 bg-white/50 outline-none focus:bg-white"
                        value="0">
                </div>
            </div>
        </div>

        <!-- Step 3: Output -->
        <div class="glass-panel p-8 rounded-[2rem]">
            <div class="flex items-center gap-3 mb-6">
                <span
                    class="w-6 h-6 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center font-[900] text-[10px]">3</span>
                <h3 class="text-xs font-[900] text-slate-600 uppercase tracking-widest">Detail Output</h3>
            </div>
            <div class="grid md:grid-cols-3 gap-4 mb-6">
                <div><label class="text-[9px] font-bold text-slate-400 uppercase">PG</label><input type="number"
                        id="q_pg" class="w-full p-2 rounded-lg bg-white/50 border border-slate-200" value="0"></div>
                <div><label class="text-[9px] font-bold text-slate-400 uppercase">PG Komplks</label><input type="number"
                        id="q_pgk" class="w-full p-2 rounded-lg bg-white/50 border border-slate-200" value="0"></div>
                <div><label class="text-[9px] font-bold text-slate-400 uppercase">Essay</label><input type="number"
                        id="q_essay" class="w-full p-2 rounded-lg bg-white/50 border border-slate-200" value="0"></div>
            </div>

            <button id="btnGen" onclick="generatePrompt()"
                class="w-full bg-slate-900 text-white py-5 rounded-2xl font-[900] text-xs uppercase tracking-[0.25em] shadow-xl hover:bg-purple-600 transition-all duration-300 transform hover:-translate-y-1">
                Generate Prompt
            </button>
        </div>
    </div>

    <script>
        // Copy logic simplified from original
        async function generatePrompt() {
            const mapel = document.getElementById('mapel').value;
            // ... gather other values ...
            const p = `Bertindaklah sebagai ahli pembuat soal... [Generated Prompt for ${mapel}] ...`;

            await navigator.clipboard.writeText(p);
            if (window.parent.showToast) window.parent.showToast("Prompt Exam tersedia!", "success");
            else alert("Copied!");
        }
    </script>
</body>

</html>
